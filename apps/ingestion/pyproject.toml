[project]
name = "my-ledger-ingestion"
version = "0.1.0"
description = "Plaid ingestion for the my-ledger warehouse."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "plaid-python>=35,<36",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
